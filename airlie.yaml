# airlie configuration. Every seam of the system is chosen here; `airlie.local.yaml` (gitignored) deep-merges on top.
# Reference: docs/superpowers/specs/2026-10-12-airlie-design.md. Validate with `task doctor`, inspect with `task config`.
version: 1

includes:
  - config/models.yaml
  - config/roles.yaml
  - config/profiles.yaml

# ---- Inference engines ------------------------------------------------------------------------------------------
# A `vllm_mlx` engine is a process airlie starts for you (`task up`); `openai_http` is any external
# OpenAI-compatible server (llama-server, mlx_lm.server, vllm-mlx you run yourself). Roles pick a model; the engine
# that serves that model is derived, so swapping engines never touches the roles.
engines:
  main:
    kind: vllm_mlx
    host: 127.0.0.1
    port: 8080
    models: [small, llama70b, qwen25_32b, generalist, reviewer, coder8]   # one process; preloaded + lazy (--models-config)
    memory_budget_gb: 90           # vllm-mlx cap on resident WEIGHTS only; the doctor projects weights + KV + os_reserve against memory.wired_limit_mb (104 GB)
    continuous_batching: true
    max_num_seqs: 16               # docs/wiki/build-spec/02 §1
    max_kv_size: 65536
    prefill_step_size: 2048
    kv_cache_quantization: false
    use_paged_cache: false
    extra_args: []
    server_parsers: true           # false = airlie parses every model's output itself (design 2026-10-13 §4b)
  decision:                        # llama-server serving Kev; POST /v1/systemone (llama.cpp 0.6.0 has the endpoint)
    kind: llama_server
    host: 127.0.0.1
    port: 8081
    models: [kev4b]
    ctx_size: 16384



# ---- Tools --------------------------------------------------------------------------------------------------------
tools:
  builtin: [read_file, write_file, edit_file, list_dir, grep, shell, run_tests, git]
  shell_timeout_s: 600
  output_cap_chars: 20000
  write_file_max_overwrite_lines: 200   # longer existing files change with edit_file, not a rewrite
mcp: {}                              # name: { command, args, env } — exposed to teams as extra tools
web:
  search:                          # web_search backend; `task doctor` checks it
    kind: searxng
    url: http://127.0.0.1:8888
  fetch_timeout_s: 30

# ---- Chat attachments (design 2026-10-22-chat-attachments) -------------------------------------------------------
# Files the + in the web app's Chat attaches, under observability.state_dir/uploads. The chat role (vision: true)
# gets a picture scaled to max_image_px, a video as frames airlie samples (video_fps a second, at most
# video_max_frames, video_frame_px each: vllm-mlx 0.5.0's batched engine refuses video parts), a text file or a PDF
# as its text cut at max_text_kb, anything else as a line saying what it is. 100 MB of video is what the Cloudflare
# quick tunnel lets through; Tailscale has no such limit.
# ---- LHR authoring (lhr-office /api/authoring; token in state_dir/lhr/supabase_token) ---------------------------
lhr:
  office_url: http://127.0.0.1:3001
  site_base_url: null                # set in airlie.local.yaml for preview links (e.g. https://loveheatrelationship.com)
  timeout_s: 60

chat:
  attachments:
    max_image_mb: 20
    max_video_mb: 100
    max_file_mb: 25
    max_text_kb: 200
    max_per_message: 10
    keep_days: 30
    max_image_px: 1536
    video_fps: 1.0
    video_max_frames: 32
    video_frame_px: 448
    history_images: 4
    history_videos: 1

# ---- Learning to Share --------------------------------------------------------------------------------------------
lts:
  enabled: false                   # off by default since the 2026-10-13 topology bench (single agent won); spec: true
  controller:
    kind: heuristic                # always | never | heuristic | judge | learned
    judge_role: judge
    threshold: 0.5
    duplicate_jaccard: 0.8
  summarizer:                      # truncate = spec 04 §3 blueprint
    kind: role
    role: summarizer
    max_words: 20
    truncate_chars: 100
  max_keys: 12                     # keys injected per step, ranked for the team (see ranking)
  max_value_chars: 20000
  background_admission: true       # summarize + decide off the team's critical path
  admission_concurrency: 2
  ranking: relevance               # relevance = overlap with the team's last step | recency = spec blueprint order
  inject_own: false                # a team does not see its own keys
  inline_top: 2                    # top-ranked keys get their value inlined, once per team
  inline_chars: 1500

# ---- Router (design 2026-10-13 §6) ------------------------------------------------------------------------------
router:                            # jev | chief
  kind: jev
  model: kev4b
  ambiguous_gap: 0.15
  min_confidence: 0.5

# ---- Topology -------------------------------------------------------------------------------------------------
topology:
  kind: single                     # single | teams | fork; each selects its profile below (task run -- --topology X)
fork:
  width: 2                         # children per fork point
  after_failures: 2                # consecutive failing run_tests that mark a branch stuck
  child_steps: 15                  # steps a child gets before resolve
  max_rounds: 3
  max_total_steps: 120
  diversify: hypotheses            # hypotheses (one small-model call per fork) | temperature
  hypothesis_role: hypothesizer
  temperatures: [0.3, 0.7]

# ---- Repository map (every topology) --------------------------------------------------------------------------
repo_map:                          # tree + Python signatures, injected before the goal
  enabled: true
  max_chars: 6000
  depth: 3

# ---- Scheduling, teams, aggregation --------------------------------------------------------------------------------
scheduler:
  kind: slots
  max_active: 4
  starvation_ms: 30000
teams:                             # k: 1 = single agent (bench 2026-10-13); spec: k: 3
  k: 1
  role: coder
  orchestrator: native
  max_steps: 40
  token_budget: 200000
  stop_on_first_pass: true
  fresh_continuation_tokens: 32768
aggregator:                        # spec 01 §4 step 9
  kind: llm
  role: aggregator
  judge_role: judge

# ---- Host + observability -----------------------------------------------------------------------------------------
memory:                            # docs/wiki/build-spec/01 §1; `task doctor` projects the total
  wired_limit_mb: 106496
  os_reserve_gb: 12
observability:
  state_dir: ~/.local/state/airlie
  capture: true
  retain_days: 14
# Sign-in for the web app (docs/superpowers/plans/2026-10-17-sign-in.md): people come as themselves, by Tailscale
# identity behind `tailscale serve` or a passkey from an invite (`task auth:admin`, `task auth:invite`); the
# --api-key stays for OpenCode and `airlie mcp`. The user store is observability.state_dir/auth.sqlite.
# auth:
#   tailscale: true                # trust Tailscale-User-Login on requests tailscale serve proxies (loopback)
#   rp_id: studio.tail1234.ts.net  # WebAuthn relying party (default: the request's host)
#   origins: [https://studio.tail1234.ts.net]
#   session_days: 30
#   invite_hours: 24

# ---- Stories (task story; docs/integrations/story.md) -------------------------------------------------------------
# A Jira issue (or --text) → product's story → architect's layers → each layer built from the architect's package
# by the studio on its own branch → stacked draft PRs (gh stack) → the issue in review. Only a human merges. ATLASSIAN_BASE_URL,
# ATLASSIAN_PROJECT_KEY, ATLASSIAN_EMAIL and ATLASSIAN_API_KEY say which Jira and who. Prefer ~/.config/airlie/.env
# (one file for every checkout; a git-ignored .env beside this file works too) to exporting them in the shell: airlie
# reads those files itself and exports nothing, while an exported variable reaches every child process (the coder's
# shell, the test gate, gh, git). A variable set in the shell still wins over both files. An issue is built in the
# repository its repo:<owner>/<name> label names (its clone under story.repos_root, default ~/git), gated by that
# repository's AGENTS.md "## Test gate". Personal settings go in airlie.local.yaml.
story:
  topology: studio                 # the profile story runs load (start it with `task restart -- --topology studio`)
  trunk: main                      # the stack's base branch
  max_layers: 5
  amigos:                          # P2 (2026-10-24): product, the architect and the tester agree requirements, changes and proof before any layer is built
    enabled: true
    max_turns: 12                  # at the cap each owner's part stands and the open objections are recorded
  supervisor:                      # the trial (spec 2026-10-22); false = today's behaviour exactly
    enabled: true
    per_layer: 6
    timeout_s: 300
  plan:                            # how an approved epic is planned into stories (docs/integrations/story.md, Epics)
    max_stories: 8
    max_scope_files: 8
  specs:                           # an approved initiative becomes a core epic and extensions (docs/integrations/story.md, Initiatives)
    enabled: true
  jira:
    statuses:
      intake: "To Do"
      building: "In Progress"
      review: "In Review"
      blocked: "Blocked"
  github_app:                      # publish as a GitHub App's bot, never with your own gh login or SSH key
    app_id: 5332832                # airlie-bot-weyenk; put your own app's id in airlie.local.yaml (null: your login)

# ---- The line (planning-line P5; docs/superpowers/specs/2026-10-25-line-scheduler-design.md) ---------------------------
line:
  home_repo: null                  # owner/name where fix cards are built; null = the remote of the checkout the line runs from
  transient_retries: 2             # a story blocked by a fetch or engine failure is retried this often per signature
  tick_s: 60                       # task serve runs a beat of the line this often (the launchd agent is the belt, every 15 minutes)
  serve_ticks: true
  fanout: 4                        # short asks (consultations, surveys, reads, renders) run this wide beside the build's decode
  decode_floor_tps: 12.0           # ... and one at a time while the build's last five steps decode under this
  consult_context: 8192            # the doctor counts each short ask at this context
  # What a card's stage is expected to cost: recorded in stages/<stage>.json and warned at 80 percent, noted at
  # 100, never enforced (the stage's own caps stay the only stops). Wall-clock seconds and tokens (prompt plus
  # completion). The medians doubled over the recorded cards, `uv run python scripts/stage_medians.py`, 2026-10-25:
  # survey (n=9), refine (15), plan (14: the architect's layer split or an epic's plan), layer (98 builds, one per
  # attempt of a layer), publish (8). The stages the planning line made have no recorded run yet, so their
  # budgets are borrowed from the nearest stage by role and tools until the first weeks of `task line:stats`
  # have samples: questions from refine (product's turn), imagine, amigos and package from plan (the
  # architect's long turns), review from the performance review's minute-a-layer (docs/bench) doubled.
  budgets:
    survey: {wall_s: 682, tokens: 233736}
    refine: {wall_s: 499, tokens: 267186}
    questions: {wall_s: 499, tokens: 267186}      # no sample: borrowed from refine
    imagine: {wall_s: 4575, tokens: 715411}       # no sample: borrowed from plan
    amigos: {wall_s: 4575, tokens: 715411}        # no sample: borrowed from plan
    plan: {wall_s: 4575, tokens: 715411}
    package: {wall_s: 4575, tokens: 715411}       # no sample: borrowed from plan
    layer: {wall_s: 3208, tokens: 2153432}
    review: {wall_s: 300, tokens: 400000}         # no sample: the performance review's minute a layer, generously
    publish: {wall_s: 57, tokens: 1}              # no model runs in it: wall-clock only

# ---- Job Bus bridge (task bridge; docs/bridge-contract.md, src/airlie/serve/bridge/README.md) -------------------
# Outbound worker on the Mac Studio: HTTPS claim/result to the hub, loopback POST /v1/airlie/runs on task serve.
# Set bridge.job_bus_url and allowed_repos in airlie.local.yaml; put BRIDGE_WORKER_SECRET in
# ~/.config/airlie/bridge.env (chmod 600), or export it (and AIRLIE_SERVE_API_KEY when serve requires it).
# bridge:
#   job_bus_url: https://your-hub.vercel.app/api/v1
#   worker_secret_env: BRIDGE_WORKER_SECRET
#   serve_url: http://127.0.0.1:8090
#   claim_poll_s: 5
#   job_poll_s: 2
#   concurrency: 1
#   kinds: [studio, llm]
#   llm:                             # the llm kind: a raw catalog model, the job's persona is the only system text
#     model: generalist
#     max_tokens: 16384              # caps thinking plus answer; must exceed thinking_budget
#     thinking: true
#     thinking_budget: 8192
#     timeout_s: 900
#   allowed_repos:
#     - key: lhr
#       path: /Users/you/git/lhr-office
#       default: true
#   test_cmds: []                    # optional allowlist; first entry is the default test_cmd sent to serve

# ---- The local board (task serve: /v1/board; task board:export) ---------------------------------------------------
# airlie's own board: initiative → epic → story → subtask, in observability.state_dir/board.sqlite. The story pipeline
# takes its stories from it (story.board: local, the default; `jira` keeps Jira). Keys are <prefix>-<n>; an import
# (task board:import-jira) keeps the Jira issue's number under this prefix (HDS-5 → AIR-5).
# board:
#   prefix: AIR
