# The harder, more ambiguous story (task bench:story -- wiki): a Vue layer and a Python one in airlie itself,
# with a request a refine can narrow. Run A (today's pipeline) blocked at layer 2 after 302 minutes; run B (the
# planning line with levers 1-3) published 3 layers in 275 (2026-10-27, docs/bench/story-wiki-baseline.json).
id: wiki
request: >-
  Make the existing wiki (docs/wiki) more Wikipedia-like and expose it in airlie's web UI.
repo: weyenk/airlie             # its clone under story.repos_root; the story publishes there, the bench closes the PRs
base: b41d8ce3bea98fa097f00e3b191aa06346f03c14   # main when run B built it; a run on another says so
oracle: wiki_oracle.py          # beside this file; mounts the built app's wiki routes in jsdom with Vitest
mutate: null                    # the mutation score's mutants are Python's, and this story's code is TypeScript
gate_timeout_s: 1800            # airlie's own gate: uv sync, ruff, mypy, pytest and the web build
budgets:
  wall_min: 300
  oracle: all                   # "more Wikipedia-like" is half the request: contents and links on are in the spec
