# Ported from the ai-mode 2026-10 bake-off (task 2: byte size parse/format). Exact-overflow edge included on purpose:
# every model in the bake-off missed it.
id: size_parse
language: python
requirement: |
  In this repository, create `bytesize/__init__.py` exposing:
    parse_size(text: str) -> int   — parses "10", "10B", "1.5KB", "2 MiB", "3gb" (case-insensitive, optional single
      space, decimal units KB/MB/GB/TB = 1000^n, binary units KiB/MiB/GiB/TiB = 1024^n, "B" or no unit = bytes).
      Fractions are allowed only when the result is a whole number of bytes ("1.5KB" → 1500, "1.5B" → ValueError).
      Negative numbers, empty strings, unknown units, and results above 2**63-1 raise ValueError.
    format_size(n: int, binary: bool = False) -> str — formats with the largest unit that gives a value ≥ 1,
      at most one decimal, trailing ".0" dropped: 1500 → "1.5KB", 1024 (binary=True) → "1KiB", 999 → "999B",
      0 → "0B". Negative n raises ValueError.
  Add tests under `tests/` and make `python -m pytest` pass.
setup:
  files:
    pyproject.toml: |
      [project]
      name = "bytesize-task"
      version = "0.0.1"
      requires-python = ">=3.12"
      [tool.pytest.ini_options]
      testpaths = ["tests", "hidden_tests"]
run_cmd: python -m pytest -q
hidden_tests:
  hidden_tests/test_hidden.py: |
    import pytest
    from bytesize import parse_size, format_size

    def test_parse_plain_and_bytes():
        assert parse_size("10") == 10
        assert parse_size("10B") == 10
        assert parse_size("0") == 0

    def test_parse_decimal_and_binary_units():
        assert parse_size("1.5KB") == 1500
        assert parse_size("2 MiB") == 2 * 1024**2
        assert parse_size("3gb") == 3 * 1000**3
        assert parse_size("1TiB") == 1024**4

    def test_parse_rejects_fractional_bytes_and_bad_input():
        for bad in ("1.5B", "", "-1KB", "1XB", "KB", "1..5KB"):
            with pytest.raises(ValueError):
                parse_size(bad)

    def test_parse_exact_overflow_boundary():
        assert parse_size(str(2**63 - 1)) == 2**63 - 1
        with pytest.raises(ValueError):
            parse_size(str(2**63))
        with pytest.raises(ValueError):
            parse_size("9.3EB" if False else "10000000TB")

    def test_format_decimal():
        assert format_size(0) == "0B"
        assert format_size(999) == "999B"
        assert format_size(1500) == "1.5KB"
        assert format_size(1000) == "1KB"
        assert format_size(1234567) == "1.2MB"

    def test_format_binary_and_negative():
        assert format_size(1024, binary=True) == "1KiB"
        assert format_size(1536, binary=True) == "1.5KiB"
        with pytest.raises(ValueError):
            format_size(-1)
