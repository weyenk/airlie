# airlie — every action is a task. Run `task` to list them.
version: '3'

# Deliberately no `dotenv:`. Task would export .env, which holds the Jira token, to every task's process and so to its
# children (the coder's shell tool, the test gate, gh, git, the engines). airlie reads .env beside airlie.yaml itself.

vars:
  UV: uv
  RUN: uv run --quiet

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  setup:
    desc: One-time setup (idempotent) — installs the pinned Python and all dependencies via uv
    cmds:
      - '{{.UV}} python install 3.12'
      - '{{.UV}} sync --all-groups'
      - cmd: test -f airlie.local.yaml || cp airlie.local.example.yaml airlie.local.yaml
        silent: true
      - task: hooks:install
      - echo "ready — try 'task doctor'"

  doctor:
    desc: Check config, hardware limits, models on disk and tooling; exit 1 on any red row
    cmds:
      - '{{.RUN}} airlie doctor {{.CLI_ARGS}}'

  config:
    desc: Print the fully resolved configuration (airlie.yaml + airlie.local.yaml)
    cmds:
      - '{{.RUN}} airlie config show {{.CLI_ARGS}}'

  models:list:
    desc: Show the model catalog with pinned revisions and serving engine
    cmds:
      - '{{.RUN}} airlie models list {{.CLI_ARGS}}'

  models:pull:
    desc: "Download every catalog model at its pinned revision (pass names to limit: task models:pull -- small)"
    cmds:
      - '{{.RUN}} airlie models pull {{.CLI_ARGS}}'

  up:
    desc: Start the vllm-mlx engine(s) from airlie.yaml and wait until preloaded models are ready
    cmds:
      - '{{.RUN}} airlie engine up {{.CLI_ARGS}}'

  down:
    desc: Stop the managed engine(s)
    cmds:
      - '{{.RUN}} airlie engine down {{.CLI_ARGS}}'

  restart:
    desc: Stop then start the managed engine(s)
    cmds:
      - '{{.RUN}} airlie engine restart {{.CLI_ARGS}}'

  status:
    desc: Show engine pid, health and per-model readiness
    cmds:
      - '{{.RUN}} airlie engine status {{.CLI_ARGS}}'

  logs:
    desc: "Tail the engine log (task logs -- -f to follow)"
    cmds:
      - '{{.RUN}} airlie engine logs {{.CLI_ARGS}}'

  run:
    desc: "Run the configured topology on a goal in a repo (task run -- \"goal\" --repo PATH --topology fork --test-cmd \"pytest -q\")"
    cmds:
      - '{{.RUN}} airlie run {{.CLI_ARGS}}'

  studio:
    desc: "Run the studio topology (task studio -- \"goal\" --repo PATH [--image shot.png] [--test-cmd \"pytest -q\"])"
    cmds:
      - '{{.RUN}} airlie studio {{.CLI_ARGS}}'

  story:
    desc: "A Jira issue or --text \"request\" → story → layers → test-first build → stacked draft PRs (task story -- ISSUE [--repo PATH] [--test-cmd CMD]; ISSUE is AIR-7 or its link)"
    cmds:
      - '{{.RUN}} airlie story run {{.CLI_ARGS}}'

  story:tick:
    desc: "One scheduler beat by hand: build the top issue of the intake query unless a story is in flight (the launchd agent runs the same command; docs/integrations/story.md)"
    cmds:
      - '{{.RUN}} airlie story tick {{.CLI_ARGS}}'

  story:check:
    desc: "Check what task story needs: roles, gh + gh-stack, who publishes (your gh login or story.github_app's bot), the Jira project and its statuses; task story:check -- ISSUE also its repo: label, checkout, remote, trunk and test gate"
    cmds:
      - '{{.RUN}} airlie story check {{.CLI_ARGS}}'

  story:launchd:install:
    desc: "Load the launchd agent that runs the story tick (airlie story tick) every 15 minutes from this checkout (docs/integrations/story.md)"
    cmds:
      - mkdir -p ~/Library/LaunchAgents ~/.local/state/airlie
      - sed -e 's|__AIRLIE_DIR__|{{.ROOT_DIR}}|g' -e "s|__HOME__|$HOME|g" docs/integrations/story-tick.plist > ~/Library/LaunchAgents/dev.airlie.story-tick.plist
      - plutil -lint ~/Library/LaunchAgents/dev.airlie.story-tick.plist
      - launchctl bootout gui/$(id -u)/dev.airlie.story-tick 2>/dev/null || true
      - launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/dev.airlie.story-tick.plist
      - echo "loaded; the log is ~/.local/state/airlie/story-tick.log"

  story:launchd:uninstall:
    desc: "Unload the story pickup launchd agent and remove its plist"
    cmds:
      - launchctl bootout gui/$(id -u)/dev.airlie.story-tick 2>/dev/null || true
      - rm -f ~/Library/LaunchAgents/dev.airlie.story-tick.plist

  eval:
    desc: "Run a graded coding task end to end (task eval -- lang_detect --k 1 | --topology fork)"
    cmds:
      - '{{.RUN}} airlie eval run {{.CLI_ARGS}}'

  memory:
    desc: "Show a run's shared memory bank (task memory -- RUN_ID [--full])"
    cmds:
      - '{{.RUN}} airlie memory {{.CLI_ARGS}}'

  board:export:
    desc: "Write the local board as JSON next to board.sqlite (task board:export -- --out FILE)"
    cmds:
      - '{{.RUN}} airlie board export {{.CLI_ARGS}}'

  serve:
    desc: "OpenAI-compatible endpoint on 127.0.0.1:8090 (roles + catalog models; POST /v1/airlie/run). task serve -- --api-key SECRET before a tunnel"
    cmds:
      - '{{.RUN}} airlie serve {{.CLI_ARGS}}'

  auth:admin:
    desc: "Create the first admin and print their invite link (task auth:admin -- --name Noah [--login noah@github] [--base-url https://studio.tailxxxx.ts.net]); docs/integrations/sign-in.md"
    cmds:
      - '{{.RUN}} airlie auth admin {{.CLI_ARGS}}'

  auth:invite:
    desc: "Invite a person to the web app: a link where they register a passkey (task auth:invite -- --name Pat [--role member|admin] [--login pat@github] [--base-url URL])"
    cmds:
      - '{{.RUN}} airlie auth invite {{.CLI_ARGS}}'

  auth:users:
    desc: "List people: id, name, Tailscale login, role, passkeys"
    cmds:
      - '{{.RUN}} airlie auth users {{.CLI_ARGS}}'

  auth:revoke:
    desc: "Remove a person; their passkeys and sessions end at once (task auth:revoke -- --id ID)"
    cmds:
      - '{{.RUN}} airlie auth revoke {{.CLI_ARGS}}'

  tunnel:
    desc: "Expose `task serve` (8090) through a Cloudflare quick tunnel for clients that call from the cloud (Cursor). Run serve with --api-key first."
    cmds:
      - cloudflared tunnel --url http://127.0.0.1:8090 {{.CLI_ARGS}}

  opencode:install:
    desc: "Copy airlie's OpenCode chief, its subagents, /studio and /story into ~/.config/opencode and add the airlie MCP server (the airlie_* tools) to its opencode.json, after a backup when it changes the file (restart OpenCode after)"
    cmds:
      - mkdir -p ~/.config/opencode/agent ~/.config/opencode/command
      - cp docs/integrations/opencode/agent/*.md ~/.config/opencode/agent/
      - cp docs/integrations/opencode/command/*.md ~/.config/opencode/command/
      # the tool file an earlier install copied: OpenCode 2.0 does not run it, airlie mcp has its tools
      - rm -f ~/.config/opencode/tool/airlie.ts
      - '{{.RUN}} airlie mcp config --install'
      - echo "installed; restart OpenCode. The airlie_* tools need 'task serve' running."

  bench:lts:
    desc: "Memory-free baseline vs LTS on graded tasks; spec 04 §4 ≥25% verdict (task bench:lts -- --tasks lang_detect)"
    cmds:
      - '{{.RUN}} airlie bench lts {{.CLI_ARGS}}'

  route:eval:
    desc: "Score the Kev router on evals/routing.jsonl (task route:eval -- --min-accuracy 0.9 --out docs/bench/routing.json)"
    cmds:
      - '{{.RUN}} airlie route eval {{.CLI_ARGS}}'

  bench:topology:
    desc: "single agent vs K teams vs fork-when-stuck vs studio on graded tasks (task bench:topology -- --topologies single,studio --repeats 3)"
    cmds:
      - '{{.RUN}} airlie bench topology {{.CLI_ARGS}}'

  controller:dataset:
    desc: "Build the controller training set from every run's admission log"
    cmds:
      - '{{.RUN}} airlie controller dataset {{.CLI_ARGS}}'

  controller:train:
    desc: "Train the spec 03 §2 controller (LoRA on Qwen3-0.6B) with the spec 03 §3 objective (task controller:train -- --epochs 5)"
    cmds:
      - '{{.RUN}} airlie controller train {{.CLI_ARGS}}'

  controller:eval:
    desc: "Replay held-out decisions: learned vs logged controller"
    cmds:
      - '{{.RUN}} airlie controller eval {{.CLI_ARGS}}'

  bench:
    desc: "Engine throughput through the seam (task bench -- --model llama70b --ctx 4k,32k --n 1,2,4)"
    cmds:
      - '{{.RUN}} airlie bench engine {{.CLI_ARGS}}'

  bench:models:
    desc: "Bench every catalog model marked bench=true, one table (task bench:models -- --ctx 4k --n 1,4)"
    cmds:
      - '{{.RUN}} airlie bench models {{.CLI_ARGS}}'

  bench:compare:
    desc: "Per-cell deltas between two saved bench JSON files (task bench:compare -- a.json b.json)"
    cmds:
      - '{{.RUN}} airlie bench compare {{.CLI_ARGS}}'

  test:
    desc: Unit tests (no models, runs anywhere)
    cmds:
      - '{{.RUN}} pytest {{.CLI_ARGS}}'

  test:live:
    desc: Live tests against a running engine (Apple Silicon, after `task up`)
    cmds:
      - '{{.RUN}} pytest -m live {{.CLI_ARGS}}'

  mutate:
    desc: "Mutation-test every enrolled module (task mutate -- --max-children 6); weakest spots: task mutate:results"
    cmds:
      - '{{.RUN}} python scripts/mutate_changed.py --scope enrolled {{.CLI_ARGS}}'

  mutate:changed:
    desc: "Mutation-test the enrolled files changed since a base ref, plus every function the changed tests run (task mutate:changed -- --base origin/main; --list previews)"
    cmds:
      - '{{.RUN}} python scripts/mutate_changed.py --scope changed {{.CLI_ARGS}}'

  mutate:project:
    desc: "Mutation-test all of src/airlie (the weekly run): enrolled modules gate, the rest is the backlog table"
    cmds:
      - '{{.RUN}} python scripts/mutate_changed.py --scope project {{.CLI_ARGS}}'

  mutate:results:
    desc: "List surviving mutants of the last run (task mutate:results -- --all true); inspect one with `uv run mutmut show NAME`"
    cmds:
      - '{{.RUN}} mutmut results {{.CLI_ARGS}}'

  hooks:install:
    desc: "Run the static checks before every push (git pre-push hook from .githooks/)"
    cmds:
      - git config core.hooksPath .githooks

  lint:
    desc: Ruff lint + format check
    cmds:
      - '{{.RUN}} ruff check .'
      - '{{.RUN}} ruff format --check .'

  fmt:
    desc: Auto-format and auto-fix lint
    cmds:
      - '{{.RUN}} ruff format .'
      - '{{.RUN}} ruff check --fix .'

  typecheck:
    desc: mypy (strict) over src/airlie
    cmds:
      - '{{.RUN}} mypy'

  static:
    desc: "Stage 1 of the pipeline and the pre-push gate: lint + typecheck, nothing executed"
    cmds:
      - task: lint
      - task: typecheck

  test:unit:
    desc: "Stage 2: the lowest level of the pyramid (tests/unit)"
    cmds:
      - '{{.RUN}} python scripts/run_layer.py unit {{.CLI_ARGS}}'

  test:functional:
    desc: "Stage 3, units in concert: functional tests (tests/functional)"
    cmds:
      - '{{.RUN}} python scripts/run_layer.py functional {{.CLI_ARGS}}'

  test:contract:
    desc: "Stage 3, units in concert: contract tests (tests/contract)"
    cmds:
      - '{{.RUN}} python scripts/run_layer.py contract {{.CLI_ARGS}}'

  test:integration:
    desc: "Stage 3, units in concert: integration tests (tests/integration)"
    cmds:
      - '{{.RUN}} python scripts/run_layer.py integration {{.CLI_ARGS}}'

  test:e2e:
    desc: "Stage 4, behavioural: end-to-end tests (tests/e2e)"
    cmds:
      - '{{.RUN}} python scripts/run_layer.py e2e {{.CLI_ARGS}}'

  test:journey:
    desc: "Stage 4, behavioural: user-journey tests (tests/journey)"
    cmds:
      - '{{.RUN}} python scripts/run_layer.py journey {{.CLI_ARGS}}'

  test:performance:
    desc: "Stage 5, environmental: performance tests (tests/performance)"
    cmds:
      - '{{.RUN}} python scripts/run_layer.py performance {{.CLI_ARGS}}'

  test:security:
    desc: "Stage 5, environmental: security tests (tests/security)"
    cmds:
      - '{{.RUN}} python scripts/run_layer.py security {{.CLI_ARGS}}'

  check:
    desc: lint + typecheck + unit tests
    cmds:
      - task: lint
      - task: typecheck
      - task: test
