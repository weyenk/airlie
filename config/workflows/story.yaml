# The story workflow: the pipeline as typed nodes. Design: docs/superpowers/specs/2026-11-06-generic-nodes-design.md
workflows:
  story:
    start: intake
    loose: [card, repo]
    nodes:
      intake:
        type: check
        run: story.intake
      base:
        type: check
        run: story.base
        outputs: {base: json}
      gate:
        type: check
        run: story.gate
        inputs: [base]
        outputs: {gate: json}
        when: story.to_build
      take_card_as_story:  # an epic's story card is the story: refine (and the survey beside it) skip
        type: check
        run: story.take_card_as_story
        outputs: {story: json}
        when: story.is_story_card
      plan_story:
        type: parallel
        nodes: [refine, survey]  # refine first: the driver starts it before the survey (the same event order)
      survey:
        type: ask
        role: architect
        prompt: story.survey
        after: story.surveyed
        inputs: [card]
        outputs: {survey: markdown}
        steps: 8
        on_fail: continue
        args: {failed: story.survey_failed}  # a survey that fails is no notes: logged, the story goes on
        when: story.survey_on
      refine:
        type: ask
        role: product
        prompt: story.refine
        parse: story.story
        after: story.refined
        inputs: [card]
        outputs: {story: json}
        steps: story.stage_attempts
        when: story.not_story_card
      costed_refine:
        type: check
        run: story.costed
        args: {stages: [survey, refine]}
      layers:
        type: conversation
        role: architect
        prompt: story.layers
        parse: story.layer_plan
        args: {turns: story.layers_turns}  # each try a conversation whose turns are the rounds (story.plan_round_steps)
        inputs: [story, base]
        outputs: {layers: list}
        steps: story.plan_max_rounds  # the turns: at most this many rounds
      costed_plan:
        type: check
        run: story.costed
        args: {stages: [plan]}
      amigos:
        type: meeting
        role: [product, architect, tester]
        run: story.amigos
        inputs: [story, layers, base]
        outputs: {agreement: json}
        steps: story.amigos.max_turns
      costed_amigos:
        type: check
        run: story.costed
        args: {stages: [amigos]}
      planned:
        type: check
        run: story.planned
      build_layers:
        type: each
        over: layers
        workflow: layer
      built:
        type: check
        run: story.build_done
      publish:
        type: check
        run: story.publish
        inputs: [layers]
        outputs: {prs: list}
      costed_publish:
        type: check
        run: story.costed
        args: {stages: [publish]}
      review:
        type: gate
        run: story.finish
