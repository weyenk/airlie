# ---- Model catalog (pinned HF revisions; `task models:pull` fetches exactly these) ---------------------------------
# Spec 01 §1 names Llama-3.3-70B-Instruct-4bit or Qwen2.5-32B-Instruct-4bit for the base-model slot. Noah 2026-10-12:
# a modern model for the same slot is fine as long as it stays configurable and benchmarkable; the spec's two left the
# catalog with the mlx-vlm engine (design 2026-11-08), never benched.
# The team model is `architect` (Qwen3.8-Flash-Next REAP, hybrid attention): the engine's hybrid prefix cache
# (engine/patches/hybrid_prefix_cache.py) keeps a resumed turn from re-prefilling its whole prompt.
# Qwen3-Coder was dropped as the team model (Noah 2026-10-18: AIR-5 showed its 6-bit fidelity too low for the speed).
# To swap the team model: change `roles.coder.model`.
models:
  small:
    repo: mlx-community/Qwen3-4B-4bit
    revision: 4dcb3d101c2a062e5c1d4bb173588c54ea6c4d25   # 2025-04-28
    estimated_memory_gb: 3
    kv_mb_per_1k_tokens: 144
  architect:                       # Qwen3.8-Flash-Next REAP (team/coding model; same name as the role)
    repo: sh0wie/Qwen3.8-Flash-Next-REAP-288-MLX-4bit
    label: Qwen 3.8 Flash Next
    revision: 668f31bcc56bf9400e64c9463445eee47597c2d9   # 2026-11-13
    mtp:
      repo: sh0wie/Qwen3.8-Flash-Next-MTP-Drafter-MLX-bf16
      revision: be6e2bc325d41ac7858b99269a96c495349b494d   # 2026-11-13
      estimated_memory_gb: 0.6
    bench: true
    estimated_memory_gb: 10.5      # REAP 4-bit MoE; `task doctor` warns if pull differs — re-measure after first pull
    kv_mb_per_1k_tokens: 48        # Flash-Next hybrid; tighten after doctor documents actual layers
    tool_call_parser: qwen3_coder
    tags: [modern, coder, vision, hybrid-attention]
  gemma4:                          # Gemma 4 26B-A4B-it QAT 8-bit: chat, design, ux
    label: Gemma 4
    repo: mlx-community/gemma-4-26B-A4B-it-qat-8bit   # bf16 (51.6 GB) does not fit beside the studio
    revision: bedc5c51905d796b192de24567f358b0b1653d2e   # 2026-06-05
    # no MTP: its QAT assistant decoded slower at 3k and 150k tokens (docs/bench/2026-11-12-gemma-qat-mtp.md)
    estimated_memory_gb: 28.0       # the snapshot's safetensors on the Hub
    # 5 full-attention layers × 2 KV heads × 512 dim = 20 MB/1k in bf16; the 25 sliding layers hold 1024 tokens
    # (0.2 GB a sequence) whatever the length: 22 covers both past ~100k
    kv_mb_per_1k_tokens: 22
    tool_call_parser: gemma4
    tags: [modern, vision, chat]
  decider_2b:                      # the decision model (router, decide tool) on mlx-vlm's /v1/decisions
    repo: nativ-community/decider-2b   # the repo mlx-vlm documents; Mapika/decider-2b fails to load on 0.7.12 and
                                       # clef-flash-4bit is no decision model there. LiquidAI/d1-3B is the documented
                                       # alternative, not in the catalog.
    revision: acbae4ecce4dbcc0aea8c5a501c9f54008458a70
    estimated_memory_gb: 3.5
  controller_base:                 # M5: base for the learned LTS admission controller (LoRA r=16)
    repo: Qwen/Qwen3-0.6B
    revision: c1899de289a04d12100db370d81485cdf75e47ca
    estimated_memory_gb: 1.5
