# ---- Roles --------------------------------------------------------------------------------------------------------
roles:
  summarizer:                      # LTS summary keys (15–20 words), stateless
    prompt: prompts/roles/summarizer.md
    model: small
    max_context: 8192
    max_tokens: 64
    thinking: false
    sampling:
      temperature: 0.2
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  judge:                           # YES/NO admission judge and aggregator tie-breaker
    prompt: prompts/roles/judge.md
    model: small
    max_context: 16384
    max_tokens: 256
    thinking: false
    sampling:
      temperature: 0.0
      top_p: 1.0
      top_k: 0
      min_p: 0.0
      presence_penalty: 0.0
  hypothesizer:                    # fork-when-stuck: lists distinct root-cause hypotheses at a fork point
    prompt: prompts/roles/hypothesizer.md
    model: small
    max_context: 16384
    max_tokens: 400
    thinking: false
    sampling:
      temperature: 0.7
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  # ---- studio roles (design 2026-10-13): specialists are prompts over three models; summaries route them ----
  # A thinking role's max_tokens caps its thinking AND its answer, so config load refuses max_tokens <= thinking_budget
  # (HDS-3, 2026-10-15). These roles use 16384 over a budget of 8192, which leaves up to 8192 tokens for the answer.
  chief:
    prompt: prompts/roles/chief.md
    model: architect
    tools: [web_search, web_fetch]
    max_steps: 4
    max_context: 131072
    max_tokens: 16384
    thinking: true
    thinking_budget: 8192
    sampling:
      temperature: 0.3
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  chat:                            # the web app's Chat (AIR-36): prose, no tools (the passthrough runs none); skills/chat are its slash commands
    prompt: prompts/roles/chat.md
    skills: skills/chat
    model: gemma4
    tools: []
    vision: true
    max_context: 131072
    max_tokens: 16384
    thinking: true
    thinking_budget: 8192
    sampling:
      temperature: 0.3
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  lhr:                             # LHR authoring via lhr-office (Chat /lhr-publish only; not a chat model name)
    prompt: prompts/roles/lhr.md
    model: architect
    tools:
      - lhr_create_draft
      - lhr_update_section
      - lhr_set_recipe
      - lhr_upload_photo
      - lhr_preview
      - lhr_publish
      - lhr_list_drafts
    max_steps: 12
    max_context: 131072
    max_tokens: 16384
    thinking: true
    thinking_budget: 8192
    sampling:
      temperature: 0.3
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  architect:
    prompt: prompts/roles/architect.md
    model: architect
    skills: skills/qa
    tools: [read_file, write_file, edit_file, list_dir, grep, shell, run_tests, git, compute]
    max_context: 131072
    max_tokens: 12288                  # 4096 thinking_budget + 8192 answer headroom on package turns; build uses less
    thinking: true
    thinking_budget: 4096
    answer_after_cuts: 3
    last_turn_thinking: false
    nudge_stuck: true
    green_before_done: true
    think_when_red: true
    write_schedule:
      tests: 0.25
      code: 0.75
    max_steps: 40
    sampling:
      temperature: 0.3
      top_p: 0.8
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.05
  product:
    prompt: prompts/roles/product.md
    model: gemma4
    tools: [read_file, list_dir, compute]
    max_tokens: 8192                # an epic set is longer than a story (the specs phase, 2026-10-25)
    max_context: 131072             # the imagining conversation holds the consultations
    thinking: false
    max_steps: 8
    sampling:
      temperature: 0.5
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  ux:
    prompt: prompts/roles/ux.md
    model: gemma4
    tools: [web_search, web_fetch]
    max_steps: 6
    vision: true
    max_tokens: 8192
    thinking: false
    sampling:
      temperature: 0.5
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  design:
    prompt: prompts/roles/design.md
    model: gemma4
    tools: [web_search, web_fetch]
    max_steps: 6
    vision: true
    max_tokens: 8192
    thinking: false
    sampling:
      temperature: 0.5
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  docs:
    prompt: prompts/roles/docs.md
    model: architect
    tools: [read_file, list_dir, grep]
    max_tokens: 4096
    thinking: false
    max_steps: 12
    sampling:
      temperature: 0.4
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  research:
    prompt: prompts/roles/research.md
    model: architect
    tools: [read_file, list_dir, grep, search_knowledge, web_search, web_fetch]
    knowledge: knowledge/research
    max_tokens: 16384
    thinking: true
    thinking_budget: 8192
    max_steps: 12
    sampling:
      temperature: 0.4
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  security:
    prompt: prompts/roles/security.md
    model: architect
    tools: [read_file, list_dir, grep]
    max_tokens: 4096
    thinking: false
    max_steps: 15
    sampling:
      temperature: 0.3
      top_p: 0.8
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.05
  reviewer:                        # on Gemma since 2026-11-12 (Noah): a different lab than the coder's Qwen, already resident, so no second model in memory
    prompt: prompts/roles/reviewer.md
    model: gemma4
    tools: [web_search, web_fetch]
    max_steps: 4
    max_context: 131072
    max_tokens: 16384
    thinking: false
    sampling:
      temperature: 0.2
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  supervisor:                      # layer 1 of the supervisor (spec 2026-10-22): advisory triage on the reviewer's model (Gemma since 2026-11-12); run_test is added by the triage, not listed
    prompt: prompts/roles/supervisor.md
    model: gemma4
    tools: [read_file, list_dir, grep]
    max_steps: 6
    max_context: 131072
    max_tokens: 8192
    thinking: false
    sampling:
      temperature: 0.2
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  aggregator:                      # spec 01 §4 step 9: combines team outputs into the final verified answer
    prompt: prompts/roles/aggregator.md
    model: architect
    max_context: 65536
    max_tokens: 4096
    thinking: false
    thinking_budget: 8192
    sampling:
      temperature: 0.3
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
