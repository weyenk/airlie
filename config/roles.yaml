# ---- Roles --------------------------------------------------------------------------------------------------------
roles:
  coder:                           # the team agent: ReAct loop with repo tools
    prompt: prompts/roles/coder.md
    model: generalist
    max_context: 65536
    max_tokens: 10240                # the answer alone (no thinking): room for a whole-file write (HDS-5)
    thinking: false                  # 2026-10-18: the architect's brief is the plan. A thinking coder (Qwen3.8) ran its
                                     # budget out re-deliberating the brief every step and read instead of writing
                                     # (AIR-7, AIR-28: 10 of 21 steps at the cap); its fast steps were the ones where
                                     # it did not think
    nudge_stuck: true              # told once to do something else when it repeats an action, not stopped
    green_before_done: true        # told once to go on when it answers with run_tests failing (AIR-5 layer 02)
    think_when_red: true           # thinks only while its last run_tests failed (and may only write then): roman 2026-10-28
    thinking_budget: 4096          # rewrote the same wrong file three times red; at 2048 every red step was cut and read
    write_schedule:                # a test written by a quarter of its steps, code by three quarters,
      tests: 0.25                  # else told once, then write-only tools (AIR-28: it read 21 of 40 steps)
      code: 0.75
    sampling:                      # low temp; 1.05 guards against repetition collapse
      temperature: 0.3
      top_p: 0.8
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.05
  summarizer:                      # LTS summary keys (15–20 words), stateless
    prompt: prompts/roles/summarizer.md
    model: small
    max_context: 8192
    max_tokens: 64
    thinking: false
    sampling:
      temperature: 0.2
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  judge:                           # YES/NO admission judge and aggregator tie-breaker
    prompt: prompts/roles/judge.md
    model: small
    max_context: 16384
    max_tokens: 256
    thinking: false
    sampling:
      temperature: 0.0
      top_p: 1.0
      top_k: 0
      min_p: 0.0
      presence_penalty: 0.0
  hypothesizer:                    # fork-when-stuck: lists distinct root-cause hypotheses at a fork point
    prompt: prompts/roles/hypothesizer.md
    model: small
    max_context: 16384
    max_tokens: 400
    thinking: false
    sampling:
      temperature: 0.7
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  # ---- studio roles (design 2026-10-13): specialists are prompts over three models; summaries route them ----
  # A thinking role's max_tokens caps its thinking AND its answer, so config load refuses max_tokens <= thinking_budget
  # (HDS-3, 2026-10-15). These roles use 16384 over a budget of 8192, which leaves up to 8192 tokens for the answer.
  chief:
    prompt: prompts/roles/chief.md
    model: generalist
    tools: [web_search, web_fetch]
    max_steps: 4
    max_context: 131072
    max_tokens: 16384
    thinking: true
    thinking_budget: 8192
    sampling:
      temperature: 0.3
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  chat:                            # the web app's Chat (AIR-36): prose, no tools (the passthrough runs none); skills/chat are its slash commands
    prompt: prompts/roles/chat.md
    skills: skills/chat
    model: generalist
    tools: []
    vision: true
    max_context: 131072
    max_tokens: 16384
    thinking: true
    thinking_budget: 8192
    sampling:
      temperature: 0.3
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  lhr:                             # LHR authoring via lhr-office (Chat /lhr-publish only; not a chat model name)
    prompt: prompts/roles/lhr.md
    model: generalist
    tools:
      - lhr_create_draft
      - lhr_update_section
      - lhr_set_recipe
      - lhr_upload_photo
      - lhr_preview
      - lhr_publish
      - lhr_list_drafts
    max_steps: 12
    max_context: 131072
    max_tokens: 16384
    thinking: true
    thinking_budget: 8192
    sampling:
      temperature: 0.3
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  architect:
    prompt: prompts/roles/architect.md
    model: generalist
    tools: [read_file, list_dir, grep, compute]
    max_context: 131072
    # 16384 until 2026-11-01: AIR-47 layer 02's package (8 tests added to test_story_pipeline.py, 40k chars of
    # tests + 13k of files, steps and covers) was cut off at the cap; the reply was the package, not a copied file
    max_tokens: 24576
    thinking: true
    thinking_budget: 2048            # 8192 until 2026-10-26: the roman bench's architect wrote to the cap on nearly every call (lever 1 of 3, Noah)
    last_turn_thinking: false
    nudge_stuck: true
    max_steps: 20
    sampling:
      temperature: 0.3
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  tester:                          # P2 (2026-10-24): the third amigo and the package critic; reads, never writes. On the generalist since 2026-10-26 (Noah): on Muse it lost the meeting's thread in runs 6, 8 and 10 on airlie-sandbox (empty turns, the opening echoed, its own proof never posted); the layer's reviewer stays on Muse
    prompt: prompts/roles/tester.md
    model: generalist
    tools: [read_file, list_dir, grep, compute]
    skills: skills/qa
    max_context: 131072
    max_tokens: 8192
    thinking: false
    sampling:
      temperature: 0.2
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  product:
    prompt: prompts/roles/product.md
    model: generalist
    tools: [read_file, list_dir, compute]
    max_tokens: 8192                # an epic set is longer than a story (the specs phase, 2026-10-25)
    max_context: 131072             # the imagining conversation holds the consultations
    thinking: false
    max_steps: 8
    sampling:
      temperature: 0.5
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  ux:
    prompt: prompts/roles/ux.md
    model: generalist
    tools: [web_search, web_fetch]
    max_steps: 6
    vision: true
    max_tokens: 8192
    thinking: false
    sampling:
      temperature: 0.5
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  design:
    prompt: prompts/roles/design.md
    model: generalist
    tools: [web_search, web_fetch]
    max_steps: 6
    vision: true
    max_tokens: 8192
    thinking: false
    sampling:
      temperature: 0.5
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  docs:
    prompt: prompts/roles/docs.md
    model: generalist
    tools: [read_file, list_dir, grep]
    max_tokens: 4096
    thinking: false
    max_steps: 12
    sampling:
      temperature: 0.4
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  research:
    prompt: prompts/roles/research.md
    model: generalist
    tools: [read_file, list_dir, grep, search_knowledge, web_search, web_fetch]
    knowledge: knowledge/research
    max_tokens: 16384
    thinking: true
    thinking_budget: 8192
    max_steps: 12
    sampling:
      temperature: 0.4
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  security:
    prompt: prompts/roles/security.md
    model: generalist
    tools: [read_file, list_dir, grep]
    max_tokens: 4096
    thinking: false
    max_steps: 15
    sampling:
      temperature: 0.3
      top_p: 0.8
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.05
  reviewer:                        # low: at medium a review ran its whole 16384 tokens still thinking (AIR-7 layer 02 round 1, 2026-10-18)
    prompt: prompts/roles/reviewer.md
    model: reviewer
    tools: [web_search, web_fetch]
    max_steps: 4
    max_context: 131072
    max_tokens: 16384
    thinking: false
    chat_template_kwargs:
      reasoning_strength: low
    sampling:
      temperature: 0.2
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  supervisor:                      # layer 1 of the supervisor (spec 2026-10-22): advisory triage on the reviewer model; run_test is added by the triage, not listed
    prompt: prompts/roles/supervisor.md
    model: reviewer
    tools: [read_file, list_dir, grep]
    max_steps: 6
    max_context: 131072
    max_tokens: 8192
    thinking: false
    chat_template_kwargs:
      reasoning_strength: low
    sampling:
      temperature: 0.2
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
  aggregator:                      # spec 01 §4 step 9: combines team outputs into the final verified answer
    prompt: prompts/roles/aggregator.md
    model: generalist
    max_context: 65536
    max_tokens: 4096
    thinking: false
    thinking_budget: 8192
    sampling:
      temperature: 0.3
      top_p: 0.9
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
