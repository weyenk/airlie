<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>airlie: Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.dark{--bg:#000000;--field:#16191E;--field-line:#3A3F47;--ink:#F2F4F7;--ink2:#B4B9C2;--accent:#8FB6E0;--accent-ink:#0A1A2B;--err:#F2B2AA}
.light{--bg:#F6F5F1;--field:#FFFFFF;--field-line:#C9C7BD;--ink:#17191E;--ink2:#4B4F58;--accent:#0B5F7A;--accent-ink:#FFFFFF;--err:#8E2B22}
a{color:var(--accent)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px; gap: 28px">
  <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 14px">
    <div aria-hidden="true" style="width: 72px; height: 72px; border-radius: 50%; border: 1px solid #CFE0F3; background: radial-gradient(circle at 50% 50%, #E6F0FB 0%, #9DBFE5 100%)"></div>
    <span style="font-weight: 700; font-size: 32px; letter-spacing: -0.02em">airlie</span>
    <span style="color: var(--ink2)">The studio on Noah's Mac Studio. Sign in with the key you were given.</span>
  </div>
  <form style="display: flex; flex-direction: column; gap: 14px">
    <label for="key" style="font-weight: 500">Your key</label>
    <input id="key" type="password" autocomplete="current-password" value="airlie_k_••••••••••••" style="min-height: 52px; border-radius: 12px; border: 1px solid var(--field-line); background: var(--field); color: var(--ink); padding: 0 14px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 16px">
    <span role="alert" style="color: var(--err); font-size: 14px">That key isn't valid. Ask Noah for a new one.</span>
    <button type="submit" style="min-height: 52px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; font-size: 17px; cursor: pointer">Sign in</button>
  </form>
  <div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ink2)">
    <span>Can't reach this page? Turn on Tailscale and check you're on Noah's network.</span>
    <span>Keys are personal. Noah can revoke one at any time.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: (this.props.dark ?? true) ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
