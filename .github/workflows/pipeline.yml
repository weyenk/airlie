# The pipeline, one stage per level of the test pyramid. A stage starts only when the one before it is green.
#
#   1 static        lint + types (the same `task static` that runs on every push to origin), then the Vue app's
#                   `task web:gate`: typecheck, lint, tests and the build
#   2 lowest level  unit tests, then mutation testing of the enrolled functions the change touched, in shards
#                   (the nightly run covers the enrolled modules, a weekly Mac run the whole project)
#   3 units in concert   functional, contract, integration
#   4 behavioural        end-to-end, journey
#   5 environmental      performance, security
#
# Stages 3-5 run `task test:<layer>`, which succeeds while tests/<layer>/ is empty; add tests there and the
# stage starts enforcing them. Only the e2e stage serves the application: its web app, in a container.
# Unit, functional, contract and integration run in the Linux test image (ops/test/Containerfile) under the
# runner's Docker with `--network none`: loopback only, so a test that reaches outside fails here. The
# test-image job builds that image once per run and hands it to them.
name: pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- stage 1: static ----
  static:
    # Linux since 2026-11-02: mlx installs on macOS only (pyproject.toml), and the tests and mutants
    # that need them run on the `mac` and `mutation-mac` jobs (the tests marked `mac`; tests/conftest.py)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: task static
      - run: task web:gate
      - run: task hub:gate

  # The Linux test image (ops/test/Containerfile) the unit, functional, contract and integration jobs run in,
  # built once per run and handed to them as an artifact (`docker load`). It starts with the pipeline, beside
  # `static`, so unit does not wait on it. Its layers live in the Actions cache: with pyproject.toml, uv.lock and
  # the Containerfile unchanged the build is a cache hit, and the job is mostly the export and the upload.
  test-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/test/Containerfile
          tags: airlie-test:latest
          cache-from: type=gha,scope=test-image
          cache-to: type=gha,mode=max,scope=test-image
          outputs: type=docker,dest=/tmp/airlie-test.tar
      - uses: actions/upload-artifact@v4
        with:
          name: airlie-test-image
          path: /tmp/airlie-test.tar
          retention-days: 1
          compression-level: 1

  # ---- stage 2: the lowest level of the pyramid ----
  unit:
    needs: [static, test-image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: airlie-test-image
          path: /tmp
      - run: docker load -i /tmp/airlie-test.tar
      # In the Linux test image with the outside network off, as the layers above it run. The tests marked
      # `mac` skip there and run on the `mac` job.
      # The budget fails the job on a test whose call phase took over 1 s and that tests/unit/quarantine.toml
      # does not list (setup and teardown are not timed, so a worker's cold imports are not charged to its first
      # test; tests/unit/conftest.py). No multiplier: these runners are not slower per test than a Mac under
      # -n 8 (2026-11-09: 4217 tests summed ~910 worker-seconds here against ~1770 locally).
      - run: task test:unit:image
        env:
          TEST_ENGINE: docker
          TEST_IMAGE_LOADED: "1"
          AIRLIE_TEST_BUDGET_MS: "1000"

  # The map mutmut needs before it runs a mutant: which unit tests execute which function (its stats run, the
  # whole suite under mutmut's tracing). Every shard used to build it, serially, before its first mutant; this
  # job builds it once, with the suite split over the runner's CPUs, and hands it and the generated mutants to
  # the shards (scripts/mutate_changed.py --build-map). A shard whose map is missing, or was built from other
  # files or another mutmut, builds its own and says so in its log (--map): it never runs on a partial one.
  # Linux only: the mac job's tests take other paths on macOS (mac_functions, mlx), so it maps its own.
  mutation-map:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the merge base with the PR's base branch
      - uses: ./.github/actions/setup
      - name: Map the unit tests to the functions they run
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'origin/main' }}
        run: >-
          task mutate:changed -- --base "$BASE" --gate-only --defer-setup
          --build-map "$RUNNER_TEMP/mutation-map"
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-map
          path: ${{ runner.temp }}/mutation-map/
          if-no-files-found: ignore # nothing to mutate: no map, and every shard has nothing to run
          compression-level: 0 # the mutants are gzipped already
          retention-days: 1

  # Mutation testing of the functions of enrolled modules this change touched, split over 8 runners (whole
  # functions, dealt out by size); `mutation-gate` merges the shards and is the one verdict.
  mutation:
    needs: [unit, mutation-map]
    # a failed map job leaves each shard to build its own map (and fail the same way if a test is red)
    if: ${{ !cancelled() && needs.unit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]  # 8 since 2026-11-02: a whole-module run (a setup change) took 91 min in one of 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the merge base with the PR's base branch
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        continue-on-error: true # no map (nothing to mutate, or the map job failed): --map builds one here
        with:
          name: mutation-map
          path: ${{ runner.temp }}/mutation-map
      - name: Mutation-test shard ${{ matrix.shard }} of 8
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'origin/main' }}
        run: >-
          task mutate:changed -- --base "$BASE" --gate-only --defer-setup --max-children 3
          --map "$RUNNER_TEMP/mutation-map"
          --shard ${{ matrix.shard }}/8 --results mutation/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: mutation/
          if-no-files-found: ignore

  # The unit tests that need mlx, on Apple Silicon. A macOS runner is the longest wait, so the two
  # mac jobs start with the pipeline (no `needs`) and no other job waits for them: each is its own check.
  mac:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: task test:mac

  # The mutants of the sources that import mlx (scripts/mutate_changed.py --mac-only), gated here.
  mutation-mac:
    runs-on: macos-15
    # a setup-file change (pyproject.toml, tests/unit/conftest.py) is left to the nightly run (--defer-setup), so
    # this only mutates the mac-only functions a change touched
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the merge base with the PR's base branch
      - uses: ./.github/actions/setup
      - name: Mutation-test the mac-only sources
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'origin/main' }}
        run: >-
          task mutate:changed -- --base "$BASE" --gate-only --defer-setup --max-children 3 --mac-only --split-map
          --results mutation/shard-mac.json
      - name: Gate the mac-only mutants
        run: task mutate:merge -- --merge mutation --expect 1 --report mutation-mac-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-mac  # not mutation-shard-*: the Linux gate never waits for it
          path: |
            mutation/
            mutation-mac-report.md
          if-no-files-found: ignore

  mutation-gate:
    needs: mutation
    if: always() && needs.mutation.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-shard-*
          path: mutation
      - name: Merge the shards and gate
        run: task mutate:merge -- --merge mutation --expect 8 --report mutation-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: mutation-report.md
          if-no-files-found: ignore

  # ---- stage 3: units in concert ----
  functional:
    needs: [unit, test-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        if: hashFiles('tests/functional/**/test_*.py') != ''
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: hashFiles('tests/functional/**/test_*.py') != ''
        with:
          name: airlie-test-image
          path: /tmp
      - run: docker load -i /tmp/airlie-test.tar
        if: hashFiles('tests/functional/**/test_*.py') != ''
      - run: task test:functional
        if: hashFiles('tests/functional/**/test_*.py') != ''
        env:
          TEST_ENGINE: docker
          TEST_IMAGE_LOADED: "1"

  contract:
    needs: [unit, test-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        if: hashFiles('tests/contract/**/test_*.py') != ''
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: hashFiles('tests/contract/**/test_*.py') != ''
        with:
          name: airlie-test-image
          path: /tmp
      - run: docker load -i /tmp/airlie-test.tar
        if: hashFiles('tests/contract/**/test_*.py') != ''
      - run: task test:contract
        if: hashFiles('tests/contract/**/test_*.py') != ''
        env:
          TEST_ENGINE: docker
          TEST_IMAGE_LOADED: "1"

  integration:
    needs: [unit, test-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        if: hashFiles('tests/integration/**/test_*.py') != ''
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: hashFiles('tests/integration/**/test_*.py') != ''
        with:
          name: airlie-test-image
          path: /tmp
      - run: docker load -i /tmp/airlie-test.tar
        if: hashFiles('tests/integration/**/test_*.py') != ''
      - run: task test:integration
        if: hashFiles('tests/integration/**/test_*.py') != ''
        env:
          TEST_ENGINE: docker
          TEST_IMAGE_LOADED: "1"

  # ---- stage 4: behavioural ----
  # The web app in Chromium, in the e2e image (ops/e2e/Containerfile): the image a Mac runs under Apple's
  # container, built and run here with the runner's Docker (macOS runners cannot run Apple's container). The
  # screenshot of every check is kept, pass or fail.
  e2e:
    needs: [functional, contract, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        if: hashFiles('tests/e2e/**/test_*.py') != ''
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - run: task test:e2e
        if: hashFiles('tests/e2e/**/test_*.py') != ''
        env:
          E2E_ENGINE: docker
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('tests/e2e/**/test_*.py') != ''
        with:
          name: e2e-evidence
          path: test-results/
          if-no-files-found: ignore

  journey:
    needs: [functional, contract, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        if: hashFiles('tests/journey/**/test_*.py') != ''
      - run: task test:journey
        if: hashFiles('tests/journey/**/test_*.py') != ''

  # ---- stage 5: environmental ----
  performance:
    needs: [e2e, journey]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        if: hashFiles('tests/performance/**/test_*.py') != ''
      - run: task test:performance
        if: hashFiles('tests/performance/**/test_*.py') != ''

  security:
    needs: [e2e, journey]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        if: hashFiles('tests/security/**/test_*.py') != ''
      - run: task test:security
        if: hashFiles('tests/security/**/test_*.py') != ''

  # ---- release: a green push to main publishes a GitHub Release of airlie ----
  release:
    needs: [static, unit, mutation-gate, functional, contract, integration, e2e, journey, performance, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # this job alone: it creates the tag and the release
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build the release package
        run: uv build
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # one release per merged commit: the version from pyproject.toml, the commit as build metadata, so
        # the next merge does not collide with this one's tag
        run: |
          VERSION=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          TAG="v${VERSION}+${GITHUB_SHA::7}"
          gh release create "$TAG" dist/*.whl --target "$GITHUB_SHA" --title "airlie $TAG" \
            --notes "airlie $VERSION built from $GITHUB_SHA"
