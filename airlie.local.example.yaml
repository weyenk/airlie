# Local overrides for airlie.yaml (deep-merged on top). Copy to airlie.local.yaml (gitignored).
# Example: run everything through an external OpenAI-compatible server instead of in-process MLX.
# engines:
#   main:
#     kind: openai_http
#     base_url: http://127.0.0.1:8080/v1

# The board (docs/integrations/story.md, Boards): stories come from airlie's own board by default, in
# observability.state_dir/board.sqlite, with keys <board.prefix>-<n>. Set the prefix to your Jira project key
# before `task board:import-jira` and the imported issues keep their numbers; story.board: jira keeps Jira as
# the board instead.
# board:
#   prefix: HDS
# story:
#   board: jira                           # local (the default) | jira

# Stories (task story): an issue is built in the repository its repo:<owner>/<name> label names, its clone under
# story.repos_root (default ~/git), and every layer passes the "## Test gate" of that repository's AGENTS.md;
# story.repo is only for written requests (--text). Jira's site, project, email and API token come from
# ATLASSIAN_BASE_URL, ATLASSIAN_PROJECT_KEY, ATLASSIAN_EMAIL and ATLASSIAN_API_KEY, which win over the same settings
# here. Put them in ~/.config/airlie/.env (chmod 600; one for every checkout) or a .env beside airlie.yaml (git-
# ignored; it wins over the other); airlie reads them itself and exports nothing. Prefer that to exporting them in
# the shell: an exported variable reaches every child process, and one already set in the shell wins over both
# files. Override the rest only when your project differs. Publishing as your own GitHub App: story.github_app.
# story:
#   repos_root: ~/src                     # where your clones are, if not in ~/git
#   repo: ~/git/myproject                 # a written request's repository
#   jira:
#     statuses: { review: "Code Review", blocked: null }   # null: a stopped issue stays where it is
#     jql: 'project = "AIR" AND status = "To Do" AND labels = airlie ORDER BY Rank ASC'
#     api_url: https://api.atlassian.com/ex/jira/<cloudId>/rest/api/3   # only for a scoped API token
#   github_app:
#     app_id: 1234567                     # your app's id (docs/integrations/story.md, Publishing as a bot)
#     key_file: ~/.config/airlie/github-app.pem
