# Local overrides for airlie.yaml (deep-merged on top). Copy to airlie.local.yaml (gitignored).
# Example: point the workflow engine at an Anthropic-format endpoint of your own.
# engines:
#   workflow:
#     format: openai                   # openai (default) | anthropic
#     # omlx on Mac Studio (Tailscale MagicDNS); OpenAI-compatible /v1
#     base_url: http://mac-studio:8000/v1
#     api_key: ...                     # same Bearer as omlx / rapid-mlx; or AIRLIE_WORKFLOW_API_KEY
#     models: [smart, small, fast]
#     passthru:
#       fast: Qwen3.8-Flash-Next-oQ4e-mtp
#       smart: mlx-community--Qwen3.8-27B-4bit
#       small: Qwen3.8-Flash-Next-oQ4e-mtp

# Push notifications to the installed phone app (README, Phone): who a push service may reach about this server,
# mailto:... (a dotted domain) or https://... ; without it push is off and `task doctor` warns.
# notifications:
#   contact: "mailto:you@example.com"

# Job Bus bridge (`task bridge`): hub URL + allowlisted repos here; put BRIDGE_WORKER_SECRET in
# ~/.config/airlie/bridge.env (chmod 600). Not the ATLASSIAN ~/.config/airlie/.env file.
# bridge:
#   job_bus_url: https://airlie-hub.vercel.app/api/v1
#   kinds: [studio, llm]
#   allowed_repos:
#     - key: lhr
#       path: ~/git/lhr
#       default: true
#     - key: ecff
#       path: ~/git/ecff-website

# The board (docs/integrations/story.md, Boards): stories come from airlie's own board by default, in
# observability.state_dir/board.sqlite, with keys <board.prefix>-<n> (AIR-1, AIR-2, …). `task board:import-jira`
# brings a Jira project onto it, each issue keeping its number under the prefix (HDS-5 → AIR-5); story.board: jira
# keeps Jira as the board instead.
# board:
#   prefix: AIR
# story:
#   board: jira                           # local (the default) | jira

# Stories (task story): an issue is built in the repository its repo:<owner>/<name> label names, its clone under
# story.repos_root (default ~/git), and every layer passes the "## Test gate" of that repository's AGENTS.md;
# story.repo is only for written requests (--text). Jira's site, project, email and API token come from
# ATLASSIAN_BASE_URL, ATLASSIAN_PROJECT_KEY, ATLASSIAN_EMAIL and ATLASSIAN_API_KEY, which win over the same settings
# here. Put them in ~/.config/airlie/.env (chmod 600; one for every checkout) or a .env beside airlie.yaml (git-
# ignored; it wins over the other); airlie reads them itself and exports nothing. Prefer that to exporting them in
# the shell: an exported variable reaches every child process, and one already set in the shell wins over both
# files. Override the rest only when your project differs. Publishing as your own GitHub App: story.github_app.
# story:
#   repos_root: ~/src                     # where your clones are, if not in ~/git
#   repo: ~/git/myproject                 # a written request's repository
#   jira:
#     statuses: { review: "Code Review", blocked: null }   # null: a stopped issue stays where it is
#     jql: 'project = "AIR" AND status = "To Do" AND labels = airlie ORDER BY Rank ASC'
#     api_url: https://api.atlassian.com/ex/jira/<cloudId>/rest/api/3   # only for a scoped API token
#   github_app:
#     app_id: 1234567                     # your app's id (docs/integrations/story.md, Publishing as a bot)
#     key_file: ~/.config/airlie/github-app.pem

# Self-update (Studio → Updates). Off by default, and with enabled false nothing reads a feed and nothing runs. A
# dogfood box sets channel: latest to take whatever is newest rather than only what stable points at. Nothing here is
# templated: airlie expands ${VAR} in engine urls and keys only, so a value here containing ${ is refused at load.
#
# What this buys is awareness, never installation. airlie reads the feed and reports the digest it is running beside
# the digest the channel points at; the panel's "set desired digest" only records that intent. Nothing here pulls an
# image, touches a docker socket, or restarts the running install — you put the digest it shows into your own manifest
# or stack file and your platform (Flux, Portainer's git stack, a human) applies it, then airlie reads back current.
# See docs/wiki/ops/deploying.md for the apply runbook. `task doctor` warns while this is on and the configured feed
# cannot be reached, because then airlie cannot say what is current: a feed it cannot read is reported as such, never
# as up to date.
update:
  enabled: false
  feed:
    kind: channel_pointer               # channel_pointer: read the channel document at base_url
    base_url: https://updates.example.com   # https only; required for kind: channel_pointer
    channel: stable                     # stable (the default) | latest
    # base_url is only half the address: layout says how the path under it is built, because the two hosts a feed
    # really runs on address the same document differently. mirror (the default, and what every existing config means)
    # reads <base_url>/channels/<channel>.json — the directory layout scripts/release_feed.py renders, which is what
    # a mirrored HTTPS base serves. GitHub does not serve that shape: it uploads the pointers as release ASSETS and
    # flattens the file name, so reading them off the repo takes the other layout:
    #   layout: release_asset
    #   pointer_release_tag: channel-pointers     # the one release CI uploads the pointers to
    #   base_url: https://github.com/<org>/<repo>/releases/download
    # which asks for exactly the URL the publisher uploads to. airlie reads one layout and never guesses it from the
    # host, so a wrong layout reads as a 404 rather than quietly working off someone else's tree; release_asset
    # without pointer_release_tag is refused when the config loads, not on the first check.
    # A pinned feed ignores base_url and reads a frozen copy of the feed off disk instead. path is a DIRECTORY that
    # holds the same documents the channel serves: <path>/channels/<channel>.json, plus the release document that
    # pointer names, resolved under <path>. Pointing it at one .json file is not a pinned feed; the check then fails
    # with unsupported_shape because the channel document is looked for inside the file you named, not in a directory.
    #   path: ~/.airlie/feed-mirror
    # Or pin by name with no directory at all, which needs both the version and the digest that shipped with it:
    #   pinned_version: "2026.11.3"
    #   pinned_digest: "sha256:0f3a..."
    # registry_token_env: AIRLIE_REGISTRY_TOKEN   # the NAME of the variable holding a private registry token,
    # never the token itself — which is why this is a name and not a value
