[project]
name = "airlie"
version = "0.1.0"
description = "Multi-agent build system on Apple Silicon: parallel agent teams over an in-process MLX engine with Learning-to-Share memory"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    # Spec 01 §3 dependency list, floors raised to current releases (2026-10-12).
    "mlx>=0.32.4; sys_platform == 'darwin'",
    "mlx-vlm==0.7.12; sys_platform == 'darwin'",
    "torch>=2.8", # used solely for LTS controller RL training (spec 03)
    "transformers>=5.7",
    "peft>=0.14", # LoRA adapters for the admission controller
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "httpx[http2]>=0.28",
    "numpy>=2.1",
    "rich>=13.9",
    # airlie additions
    "typer>=0.15",
    "pyyaml>=6.0",
    "jsonschema>=4.23", # prompts/reply: each node's answer checked against its template's schema
    "psutil>=6",
    "mcp>=2.3",
    "autogen-agentchat>=0.7", # spec 01 §2: AutoGen team orchestrator
    "autogen-ext[openai]>=0.7",
    "rank-bm25>=0.2.2",
    "pyjwt[crypto]>=2.10", # story.github_app: the JWT a GitHub App signs with its key
    "webauthn>=2.5", # auth: passkey (WebAuthn) registration and login ceremonies
    "duckdb>=1.0", # airlie.metrics: DuckDB aggregation over the event JSONL
    "pypdf>=6.21", # chat attachments: the text of an attached PDF
    "pillow>=11", # chat attachments: a picture scaled before it is sent
    # chat attachments: airlie samples a video's frames (the batched engine refuses video parts). The build
    # mlx-vlm installs on the Mac; headless on Linux (the e2e image): one cv2 either way.
    "opencv-python>=4.10 ; sys_platform == 'darwin'",
    "opencv-python-headless>=4.10 ; sys_platform == 'linux'",
    "huggingface-hub>=2.2",
    "py-vapid>=1.9.6",
    "http-ece>=1.2.1",
]

[project.scripts]
airlie = "airlie.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML",
    "mutmut==3.8.0",  # exact: scripts/mutate_changed.py writes and merges its stats file (mutants/mutmut-stats.json)
    "pytest-xdist>=3.8.0",
    "pytest-playwright>=0.10.0",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airlie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: needs a running engine on the Mac (run with `task test:live`)",
    "e2e: drives the web app in Chromium, in the e2e container (run with `task test:e2e`)",
    "mac: needs mlx or macOS's sandbox-exec; skipped elsewhere (tests/conftest.py); `task test:mac` runs it",
]
addopts = "-m 'not live and not e2e'"

[tool.ruff]
extend-exclude = ["docs", "vendor"]   # docs: illustrative code blocks ruff must not format; vendor: pinned upstream files, never edited
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["airlie"]
ignore_missing_imports = true

[tool.mutmut]
# mutmut mutates all of src/; scripts/mutate_changed.py picks which mutants to run (by name glob).
source_paths = ["src"]
pytest_add_cli_args_test_selection = ["tests/unit/"]
# Kept out of mutation runs only (they still run in the unit stage):
# - the MCP echo-server test and the `airlie mcp` stdio test spawn a subprocess through the MCP stdio client,
#   whose stderr is closed under mutmut's runner ("ValueError: I/O operation on closed file");
# - the torch/peft/safetensors tests are not fork-safe: mutmut forks a worker per mutant, and on macOS torch's
#   BLAS thread pool and Metal buffers segfault in a forked, multi-threaded process (a crash dialog per mutant).
# --timeout: a test that waits on a command forever fails after 120 s, so its mutant counts as caught. PR 212's
# shard 7 (2026-11-02) made no progress for 57 minutes on shell._run's mutants 38 (wait_for's timeout=None) and
# 41 (kill_group(None) on the timeout): mutmut's own limit is CPU time, and a test blocked on a pipe uses none.
# The thread method ends the stuck test's process outright and prints every thread's stack, naming the test.
pytest_add_cli_args = [
    "--timeout=120",
    "--timeout-method=thread",
    "--deselect",
    "tests/unit/test_mcp_tools.py::test_mcp_tools_are_listed_and_callable",
    "--deselect",
    "tests/unit/test_mcp_server.py::test_airlie_mcp_serves_the_five_tools_over_stdio",
    "--ignore=tests/integration/test_trainer.py",
    "--ignore=tests/unit/test_learned_controller.py",
    "--ignore=tests/integration/test_cli_controller.py",
    # the release test reads .github/workflows/pipeline.yml, which mutmut does not copy into the mutant dir
    # (it still runs in the unit stage)
    "--ignore=tests/unit/test_pipeline_release.py",
]
# Taskfile.yml and docs/integrations: tests read the task definitions, the launchd plist and OpenCode's files.
# ops: scripts/searxng_vm.py reads ops/searxng/version (AIR-7, 2026-10-18: mutmut's baseline run went red on it,
# and the story's mutation gate could not run).
also_copy = [
    "airlie.yaml",
    "config",
    "web",
    "prompts",
    "evals",
    "scripts",
    "knowledge",
    "skills",
    "ops",
    "vendor",
    "Taskfile.yml",
    "docs/integrations",
]

[tool.airlie.mutation]
# Modules held to "every mutant is caught" (the pipeline and `task mutate:enrolled` fail on a survivor).
# Enrol a module once its tests are thorough; everything else is reported, never failed.
enrolled = [
    "src/airlie/models_download.py",
    "src/airlie/manager/core.py",
    "src/airlie/router/policy.py",
    "src/airlie/scheduler/states.py",
    "src/airlie/tools/decide.py",
    "src/airlie/tools/jsonargs.py",
    "src/airlie/engine/sse.py",
    "src/airlie/lts/bank.py",
    "src/airlie/router/jev.py",
    "src/airlie/lts/inject.py",
    "src/airlie/tools/fs.py",
    "src/airlie/config/load.py",
    "src/airlie/config/schema.py",
    "src/airlie/lts/controller/heuristic.py",
    "src/airlie/scheduler/slots.py",
    "src/airlie/tools/shell.py",
    "src/airlie/tools/sandbox.py",
    "src/airlie/engine/http_engine.py",
    "src/airlie/chat/superpowers.py",
    "src/airlie/chat/kinds.py",
    "src/airlie/chat/tools.py",
    "src/airlie/chat/stream.py",
    "src/airlie/chat/threads.py",
    "src/airlie/chat/hooks.py",
    "src/airlie/chat/confirm.py",
    "src/airlie/chat/repo_session.py",
    "src/airlie/chat/task_tool.py",
    "src/airlie/boxes/mirror.py",
    "src/airlie/boxes/transit.py",
]
